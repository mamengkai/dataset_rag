# 本地依赖服务：知识库 MinIO + Milvus 2.4.11 + Attu 管理界面
# 启动：docker compose up -d
# 停止：docker compose stop
# 日志：docker compose logs -f milvus-standalone
#
# 说明：
# - minio：业务用（图片上传），宿主机 9000/9001
# - milvus-minio：Milvus 内部存储，宿主机 9002/9003（避开业务 MinIO）
# - milvus：应用连接 MILVUS_URL=http://127.0.0.1:19530
# - attu：浏览器打开 http://127.0.0.1:8000（若与 FastAPI 冲突可改端口）

services:
  minio:
    image: quay.io/minio/minio
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - ./volumes/minio/data:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped

  milvus-etcd:
    container_name: milvus-etcd
    image: quay.io/coreos/etcd:v3.5.5
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/milvus/etcd:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls=http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped

  milvus-minio:
    container_name: milvus-minio
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports:
      - "9003:9001"  # 控制台：避开业务 MinIO 的 9001
      - "9002:9000"  # API：避开业务 MinIO 的 9000
    volumes:
      # 与业务 ./volumes/minio/data 分开，避免数据混用
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/milvus/minio:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped

  milvus-standalone:
    container_name: milvus-standalone
    image: milvusdb/milvus:v2.4.11
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: milvus-etcd:2379
      MINIO_ADDRESS: milvus-minio:9000
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/milvus/data:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      - milvus-etcd
      - milvus-minio
    restart: unless-stopped

  # Attu 2.4.0：适配 Milvus 2.4.x 的管理 UI
  attu:
    container_name: attu
    image: zilliz/attu:v2.4.0
    ports:
      - "8000:3000"
    environment:
      # 同一 compose 网络内用服务名，不要写 127.0.0.1
      MILVUS_URL: milvus-standalone:19530
    depends_on:
      - milvus-standalone
    restart: unless-stopped
